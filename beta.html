<!DOCTYPE html>

<style>

    border-radius:34px;border:0;display:none;background:radial-gradient(circle at 35% 30%,#ffb04a,#c4260f);color:#fff;font-size:30px;
    box-shadow:0 4px 0 #7d1408,0 8px 18px rgba(0,0,0,.4);touch-action:none}
  #bomb::after{content:attr(data-n);position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;
    background:#ffd53d;color:#111;font:900 13px/22px system-ui,sans-serif;text-align:center}
  #bomb.empty{opacity:.45;filter:grayscale(.6)}
  #pz{position:fixed;right:12px;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:18px}
  #zm{margin-top:10px;padding:12px 22px;border-radius:12px;border:1px solid rgba(160,255,140,.5);background:rgba(120,200,90,.18);color:#d9ffc8;font-size:16px;font-weight:800}
  #qt{margin-top:10px;padding:10px 22px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.8);font-size:15px;font-weight:700}
  #sec{margin-top:10px;padding:12px 22px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-weight:700}
  #snd{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;width:40px;height:40px;
    border-radius:20px;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:18px;touch-action:manipulation}
</style>

<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<div id="ov"><div class="card">
  <h1 id="ttl">GATE RUSH</h1>

</div></div>

<script>window.__BETA_L=6000;window.__BETA_W=84;
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');
const TAU=Math.PI*2, F=28, BV=42, NGATES=14;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);

let Z=false,W=0,H=0,DPR=1,GW=0,u=1,cx=0,hy=0,py=0,safeTop=0,tilePat=null,T=0;

/* ---------- state ---------- */
const S={mode:'title',hp:25,maxHp:25,level:0,score:0,wave:0,kills:0,best:0,
  shake:0,hurt:0,hint:7,waveTimer:1,nextGateId:0,fx:null,flash:0,nuke:null,warn:1e9,alarm:0,cause:'',lz:0,vt:0,laser:{x:0,w:1.1,on:false,sndT:0},gun:1,bombs:0,bombOn:false,bombT:0};
const player={x:0,tx:0,fireT:0,flash:0};
const keys={l:0,r:0};
let zg=[],decals=[],enemies=[],bullets=[],gates=[],parts=[],texts=[],shells=[],flyBombs=[],blasts=[],assassins=[];
const M={state:'live',kind:'gate',n:0,hp:500,max:500,d:13,hit:0,drop:0,timer:0,tick:0,shellT:3.5,fire:0};
function setMega(n){
  const m=n%7, kind=m===2?'tank':m===4?'turret':m===6?'launcher':'gate', base=Math.round(500*Math.pow(1.5,n)/50)*50;
  M.n=n; M.kind=kind; M.max=M.hp=kind==='tank'?base*2:kind==='turret'?Math.round(base*2.5/50)*50:kind==='launcher'?Math.round(base*2.2/50)*50:base;
  M.shellT=3.5; M.tState='rest'; M.tT=2; M.lockX=0; M.burstLeft=0;
}
try{S.best=+localStorage.getItem('gaterushb.best')||0}catch(e){}

/* ---------- stats ---------- */
const RH=120;
const vel=()=>Z?1:S.level>=10000?Math.min(4,1+0.25*(Math.floor(S.level/5000)-1)):1;
const isBig=e=>e.boss||e.charger||e.assassin||e.rkt;
const gm=()=>S.level>=5000?20:S.level>=2500?10:S.level>=1000?4:1;
const zt=()=>{const L=S.level;return L>=50000?7:L>=10000?6:L>=5000?5:L>=2500?4:L>=500?3:L>=100?2:L>=50?1:0;};
const ZTN=['SOLDIER','MACHINE GUNNER','2 GUNNERS','JEEP + TURRET','TANK','HEAVY TANK','SUPER TANK','TANK + LASER'];
const baseRate=()=>Z?(S.gun>=5?2.4*[1,1,1,1,1,1.3,1.7,2][zt()]:S.gun>=4?3.6:S.gun>=2?12:S.level>=50?9:0.33+5.17*(Math.max(1,S.level)-1)/49):S.gun>=5?(S.lz>=2?3.6:2.4):S.gun>=4?3.6:S.gun>=3?Math.min(2.4,1.4+(S.level-250)*0.01):Math.min(5+0.5*S.level,22);
const rate=()=>baseRate()*vel();
const nb=()=>Z?(S.gun>=2?8:S.level>=50?6:Math.min(1+Math.floor(S.level/10),5)):Math.min(1+Math.floor(S.level/4),11);
const hits=()=>S.gun>=2?2:1;
const dmg=()=>{const L=S.level;return Math.round((1+Math.floor(Math.min(L,5000)/25))*(L>5000?Math.pow(L/5000,0.35):1))*(S.gun>=2?2:1);};
const gv=g=>{const L=S.level;return g.big?(L>=5000?250:L>=2500?125:L>=1000?50:L>=250?25:L>=200?15:L>=50?5:3):(L>=5000?100:L>=2500?50:L>=1000?20:L>=250?10:L>=200?5:L>=50?2:1);};
const spd=()=>Math.min(1.7+0.15*S.wave,4);
const interval=()=>Math.max(9,18-S.wave*0.6);

/* ---------- audio ---------- */
let AC=null,muted=false;
function initAudio(){
  try{ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();} if(AC.state==='suspended')AC.resume(); }catch(e){AC=null}
}
function beep(f,dur,type,vol,slide){
  if(!AC||muted)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
    g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- layout ---------- */
function makeTile(){
  const t=document.createElement('canvas'); t.width=t.height=36;
  const c=t.getContext('2d');
  if(c){
    const a=Z?['#2d352b','#3b4637','#232a21']:['#2f8196','#4aa0b4','#236576'];
    c.fillStyle=a[0]; c.fillRect(0,0,36,36);
    c.fillStyle=a[1]; c.fillRect(0,0,34,2); c.fillRect(0,0,2,34);
    c.fillStyle=a[2]; c.fillRect(34,0,2,36); c.fillRect(0,34,36,2);
    try{tilePat=ctx.createPattern(t,'repeat')}catch(e){tilePat=null}
  }
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  GW=Math.min(W,H*0.62); u=GW/9.6; cx=W/2; py=H*0.80; hy=-H*0.06;
  try{safeTop=parseFloat(getComputedStyle($('probe')).paddingTop)||0}catch(e){safeTop=0}
  makeTile();
}

/* ---------- spawn / game flow ---------- */
function newGate(){
  const k=S.nextGateId++, big=(k%6===5);
  const hp=Math.min(6000,Math.round((5+k*1.2+k*k*0.32)*(big?2.2:1)));
  gates.push({d:10+gates.length*1.25,hp,max:hp,big,hit:0,k});
}
function spawnWave(){
  S.wave++; const w=S.wave;
  const rows=Z?Math.min(1+Math.floor((w-1)*(w<12?1.5:2.6)-(w<12?0:7.5)),60):Math.min(6+Math.floor(w*3),60), sc=w>=75?1+(w-75)*0.08:1, hp=Math.round((1+Math.floor(w*0.7))*sc*(Z?0.85*(1+w*0.4):1));
  const elP=w>=2?Math.min(0.04+w*0.01,0.18):0;
  if(Z&&w<=5){const m=2+w;for(let c=0;c<m;c++)enemies.push({x:(c-(m-1)/2)*0.7,d:40+rnd(-0.3,0.3),hp:1,el:false,rad:0.36,seed:Math.random()*6.28,flash:0,dead:false});}
  for(let r=0;r<(Z&&w<=5?0:rows);r++){
    const cols=(r&1)?6:7;
    for(let c=0;c<cols;c++){
      const el=Math.random()<elP;
      enemies.push({x:(c-(cols-1)/2)*0.58+rnd(-0.04,0.04),d:40+r*0.46+rnd(-0.05,0.05),
        hp:el?Math.round((3+w)*sc):hp,el,rad:el?0.5:0.36,seed:Math.random()*6.28,flash:0,dead:false});
    }
  }
  if(w>=10){
    const nbos=1+Math.floor((w-10)/10), bhp=Math.round(200+(w-10)*60+(w-10)*(w-10)*2.5);
    for(let i=0;i<nbos;i++)enemies.push({x:nbos===1?rnd(-0.8,0.8):(i-(nbos-1)/2)*1.9,d:40+rows*0.46+4+i*0.8,
      hp:bhp,max:bhp,boss:true,el:false,rad:1.05,seed:Math.random()*6.28,flash:0,dead:false});
    floatText(Z?'🧟 GIANT INCOMING':'BOSS INCOMING',cx,H*0.37,'#ffb36b',28);
  }
  if(!Z&&w>=80&&w%2===1){
    const have=enemies.filter(e=>e.rkt&&!e.dead).length, add=Math.min(Math.min(8,4+Math.floor((w-80)/10))-have,2+Math.floor((w-80)/20));
    for(let i=0;i<add;i++){
      const side=((have+i)&1)?1:-1, rh=Math.round(Math.max(500+(w-75)*45,6*(S.gun>=5?400:S.gun>=3?120:20)*rate()));
      enemies.push({x:side*rnd(2.4,3.6),d:46+i*3,hp:rh,max:rh,rkt:true,ft:rnd(0.5,1.5),vol:0,el:false,rad:0.8,seed:Math.random()*6.28,flash:0,dead:false});
    }
    if(add>0)floatText('🚀 ROCKETEERS',cx,H*0.5,'#ff9a5a',24);
  }
  if(w>=85&&(w-85)%8===0){
    const bh2=Math.round(Math.max(30000+(w-85)*1500,30*(S.gun>=5?400:S.gun>=3?120:20)*rate()));
    enemies.push({x:0,d:50,hp:bh2,max:bh2,boss:true,brute:true,el:false,rad:2.2,seed:Math.random()*6.28,flash:0,dead:false});
    floatText(Z?'🧟 TYRANT INCOMING':'👹 BRUTE INCOMING',cx,H*0.37,'#ff6a4a',30); floatText('💣 BOMBS HURT HIM BADLY',cx,H*0.37+32,'#ffd27a',18); beep(70,0.8,'sawtooth',0.15,-20);
  }
  if(w>=8){
    const cnt=Math.min(30,6+Math.floor((w-8)*1.2)), rhp=20+Math.floor((w-8)/5)*4;
    for(let i=0;i<cnt;i++)enemies.push({x:rnd(-1.8,1.8),d:85+rnd(0,12),hp:rhp,max:rhp,runner:true,el:false,rad:0.38,
      wait:rnd(0,8),seed:Math.random()*6.28,flash:0,dead:false});
    if(w===8||w%5===0)floatText('⚡ FAST RUNNERS',cx,H*0.5,'#ffd84a',24);
  }
  if(!Z&&w>=25&&(w-25)%6===0){
    const na=1, sneak=w>=80, ahp=Math.round((400+(w-25)*25)*(1+S.level/1500));
    for(let i=0;i<na;i++)enemies.push({x:(Math.random()<0.5?-1:1)*rnd(2.4,4.2),d:58+i*5,hp:sneak?1e12:ahp,max:ahp,assassin:true,sneak:sneak,el:false,rad:0.6,
      seed:Math.random()*6.28,flash:0,dead:false});
    floatText(sneak?'☠ SNEAK ASSASSIN':'☠ ASSASSIN INCOMING',cx,H*0.5,'#ff5a5a',28);
    beep(200,0.6,'sawtooth',0.12,-120);
  }
  if(w>=20&&(w-20)%2===0){
    const nch=1+Math.floor((w-20)/16), chp=Math.round(450+(w-20)*45+(w-20)*(w-20)*1.2);
    for(let i=0;i<nch;i++)enemies.push({x:rnd(-1.4,1.4),d:46+i*3,hp:chp,max:chp,charger:true,el:false,rad:0.75,
      seed:Math.random()*6.28,flash:0,dead:false});
    floatText('⚠ CHARGER INCOMING',cx,H*0.45,'#ff6a6a',28);
    beep(70,0.5,'sawtooth',0.1,60);
  }
  if(Z&&w%5===0)floatText('🧟 HORDE SURGE',cx,H*0.45,'#b6ff8f',26);
  if(w>1)floatText('WAVE '+w,cx,H*0.3,'#ff8f8f',30);
}
function reset(){
  S.board=null; S.wjam=0; S.tutDone=false; S.hijack=false; S.lz=0; S.vt=0; S.jam=0; S.heat=0; S.coolT=0; S.droneT=6; S.laser={x:0,w:1.1,on:false,sndT:0}; S.maxHp=25; S.hp=S.maxHp; S.level=0; S.warn=1e9; S.alarm=0; S.cause=''; S.score=0; S.wave=0; S.kills=0; S.hint=7; S.waveTimer=0.8;
  S.shake=0; S.hurt=0; S.fx=null; S.nextGateId=0;
  enemies=[]; bullets=[]; gates=[]; parts=[]; texts=[]; shells=[]; flyBombs=[]; blasts=[];
  S.flash=0; S.nuke=null; S.gun=1; S.bombs=0; S.bombOn=false; S.bombT=0; syncBomb();
  while(gates.length<NGATES)newGate();
  M.state='live'; setMega(0); M.hit=0; M.drop=0; M.timer=0; M.fire=0;
  decals=[]; zg=[]; if(Z){gates=[];M.state='gone';S.level=1;S.zgT=2.5;zg.push({d:24,side:-1,n:-4,f:-4,cap:3,done:false,flash:0});zg.push({d:44,side:1,n:2,f:2,cap:6,done:false,flash:0});S.zt=0;}
  player.x=player.tx=0; player.fireT=0;
}
/* ---------- leaderboard (global when BOARD_ID is set, else this device) ---------- */
const BOARD_ID='';  // Firebase Realtime Database URL, e.g. https://xxxx-default-rtdb.firebaseio.com
let BOARD_URL=BOARD_ID.replace(/\/+$/,'')+'/gaterush/top.json', BKEY='gaterushb.board1', BESTKEY='gaterushb.best';
let board=[], boardStatus='', boardSubmitted=false, lastName='';
try{board=JSON.parse(localStorage.getItem(BKEY)||'[]')||[];lastName=localStorage.getItem('gaterushb.name')||'';}catch(e){board=[]}
const cleanBoard=a=>(Array.isArray(a)?a:[]).filter(r=>r&&typeof r.s==='number'&&isFinite(r.s)).map(r=>({n:String(r.n||'???').slice(0,10),s:Math.floor(r.s),w:Math.floor(r.w)||0})).sort((a,b)=>b.s-a.s).slice(0,5);
const saveCache=()=>{try{localStorage.setItem(BKEY,JSON.stringify(board))}catch(e){}};
async function jfetch(method,body){
  const ac=new AbortController(), tm=setTimeout(()=>ac.abort(),6000);
  try{
    const r=await fetch(BOARD_URL,{method,signal:ac.signal,headers:{'Accept':'application/json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
    if(!r.ok)throw new Error('http '+r.status);
    return method==='GET'?await r.json():true;
  }finally{clearTimeout(tm)}
}
async function refreshBoard(){
  if(!BOARD_ID){boardStatus='This device only';renderLB();return;}
  try{const d=await jfetch('GET');board=cleanBoard(d&&Object.values(d));saveCache();boardStatus='Everyone';}
  catch(e){boardStatus='Offline: showing last saved';}
  renderLB();
}
const qualifies=sc=>sc>0&&(board.length<5||sc>board[4].s);
function renderLB(hi){
  const lb=$('lb'); if(!lb)return; lb.textContent='';
  const t=document.createElement('div'); t.className='lt'; t.textContent='🏆 TOP 5'; lb.appendChild(t);
  if(!board.length){const e=document.createElement('div');e.className='ls';e.textContent='No scores yet. Be the first.';lb.appendChild(e);}
  board.forEach((r,i)=>{
    const d=document.createElement('div'); d.className='lr'+(i===hi?' me':'');
    const a=document.createElement('b'),n=document.createElement('i'),sc=document.createElement('u'),w=document.createElement('em');
    a.textContent=i+1; n.textContent=r.n; sc.textContent=r.s.toLocaleString(); w.textContent='W'+r.w;
    d.append(a,n,sc,w); lb.appendChild(d);
  });
  if(boardStatus){const f=document.createElement('div');f.className='ls';f.textContent=boardStatus;lb.appendChild(f);}
}
async function submitScore(){
  if(boardSubmitted)return; boardSubmitted=true;
  const name=($('nm').value||'').replace(/[^\w .\-!?*]/g,'').trim().toUpperCase().slice(0,10)||'ANON';
  lastName=name; try{localStorage.setItem('gaterushb.name',name)}catch(e){}
  $('nameBox').style.display='none';

function rr(x,y,w,h,r){

}
function quadH(xa,xb,da,db,h,col){

  if(Z)label=ZTN[zt()]+(S.gun<5?'   ×'+nb()+'  '+rate().toFixed(1)+'/s':'   '+rate().toFixed(1)+'/s');
  else if(S.gun>=2)label+='  ·  '+['','','PLASMA','ROCKETS','RAPID ROCKETS','BATTLE TANK'][S.gun];
  if(S.lz>=1)label+=' + '+(S.lz>=2?'DEATH RAY':'LASER');
  if(vel()>1)label+='  ×'+vel().toFixed(2);
  ctx.font='800 12px system-ui,sans-serif'; const tw=ctx.measureText(label).width+22;
  ctx.fillStyle='rgba(20,60,150,.75)'; rr(bx,top+bh+8,tw,24,12); ctx.fill();
  ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.fillText(label,bx+11,top+bh+8+13);
  if(S.lz>0&&S.mode==='play'){
    const hbw=GW*0.36, hy2=top+bh+8+24+5, hv2=S.coolT>0?0:S.heat;
    ctx.fillStyle='rgba(0,0,0,.5)'; rr(bx,hy2,hbw,9,4.5); ctx.fill();
    ctx.fillStyle=S.coolT>0?'#5a6270':(hv2>0.8?'#ff3b2a':hv2>0.5?'#ffb02e':'#4fd8ff');
    const fw=S.coolT>0?hbw*clamp(1-S.coolT/(S.lz>=2?4.0:3.0),0,1):hbw*hv2;
    if(fw>0){rr(bx,hy2,Math.max(9,fw),9,4.5);ctx.fill();}
    ctx.textAlign='left'; ctx.textBaseline='middle';
    outlinedText(S.coolT>0?'COOLING…':S.jam>0?'JAMMED':'BEAM HEAT',bx+hbw+8,hy2+5,10,S.coolT>0?'#9aa3b0':'#bfefff','#000',3);
  }
  // hint
  if(S.mode==='play'&&S.hint>0){
    ctx.globalAlpha=clamp(S.hint,0,1); ctx.textAlign='center';
    outlinedText(Z?'DRAG TO MOVE · SHOOT GATES UP · AVOID THE RED':'DRAG TO MOVE · SHOOT THE GATES',cx,H*0.93,15,'#fff','#000');
    ctx.globalAlpha=1;
  }
  if(S.flash>0){ctx.fillStyle='rgba(255,246,214,'+Math.min(1,S.flash*1.1)+')';ctx.fillRect(0,0,W,H);}
  if(S.hurt>0){
    const hg=ctx.createRadialGradient(cx,H/2,Math.min(W,H)*0.3,cx,H/2,Math.max(W,H)*0.75);
    hg.addColorStop(0,'rgba(255,0,0,0)'); hg.addColorStop(1,'rgba(255,0,0,'+(S.hurt*1.2)+')');
    ctx.fillStyle=hg; ctx.fillRect(0,0,W,H);
  }
}
function draw(){
  ctx.save();
  if(S.shake>0)ctx.translate(rnd(-1,1)*S.shake*8,rnd(-1,1)*S.shake*8);
  drawWorld(); if(Z){drawDecals();drawZGates();} else {drawGates(); drawMega();} drawEnemies(); drawFog();
  drawLaser(); drawBullets(); drawShells(); drawBombs(); drawSquad(); drawParts(); drawTexts();
  ctx.restore();
  drawHUD(); drawWarn(); drawBoard();
}

/* ---------- input ---------- */
let dragging=false;
const setTarget=x=>{player.tx=clamp((x-cx)/u,-4.5,4.5);};
let sw=null;
const swMove=e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.max(Math.abs(dx),Math.abs(dy))>=45){boardSwipe(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));sw={x:e.clientX,y:e.clientY};}};
cv.addEventListener('pointerdown',e=>{if(S.board){try{cv.setPointerCapture(e.pointerId)}catch(_){}if(S.board.stage===2)boardTap();else sw={x:e.clientX,y:e.clientY};e.preventDefault();return;}dragging=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}setTarget(e.clientX);e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(S.board){swMove(e);e.preventDefault();return;}if(dragging){setTarget(e.clientX);e.preventDefault();}});
const up=()=>{dragging=false;sw=null;};
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',e=>{
  if(S.board){const m={ArrowRight:'R',ArrowLeft:'L',ArrowDown:'D',ArrowUp:'U'}[e.key];if(m)boardSwipe(m);else boardTap();e.preventDefault();return;}
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=1; if(e.key==='ArrowRight'||e.key==='d')keys.r=1;
  if((e.key==='Enter'||e.key===' ')&&S.mode!=='play'&&!$('ov').classList.contains('hide'))startGame();
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=0; if(e.key==='ArrowRight'||e.key==='d')keys.r=0;
});
$('go').addEventListener('click',()=>{if(paused)resumeGame();else startGame();});
$('zm').addEventListener('click',()=>{if(paused)return;applyMode(!Z);refreshBoard();startGame();});
$('nm').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();submitScore();}});
$('nm').addEventListener('keyup',e=>e.stopPropagation());
$('nmok').addEventListener('click',submitScore);
$('qt').addEventListener('click',()=>{paused=false;S.mode='title';$('pz').style.display='none';syncBomb();uiTitle();$('ov').classList.remove('hide');});
$('sec').addEventListener('click',()=>{if(paused){paused=false;startGame();}else continueSaved();});
$('pz').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pauseGame();});
window.addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(paused)resumeGame();else pauseGame();}});
document.addEventListener&&document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
window.addEventListener('pagehide',()=>{if(S.mode==='play'){if(!paused)pauseGame();else saveGame();}});
$('bomb').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();throwBomb();});
window.addEventListener('keydown',e=>{if((e.key==='b'||e.key==='B')&&S.mode==='play')throwBomb();});
$('snd').addEventListener('click',()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊';initAudio();});
window.addEventListener('resize',resize);

/* ---------- loop ---------- */
let last=0,saveT=0;
function frame(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000)||0.016); last=ts;
  if(!paused){update(dt); saveT+=dt; if(saveT>4){saveT=0;saveGame();}} draw();
  requestAnimationFrame(frame);
}
try{Z=localStorage.getItem('gaterushb.mode')==='z';}catch(e){}
applyMode(Z); resize(); reset();
refreshBoard();
window.__dbg={get zg(){return zg},applyMode,get Z(){return Z},boardSwipe,boardTap,get board(){return S.board},gameOver,pauseGame,resumeGame,saveGame,loadGame,continueSaved,get paused(){return paused},S,M,player,throwBomb,setMega,spawnWave,hitMega,update,draw,startGame,reset,get enemies(){return enemies},get gates(){return gates},get bullets(){return bullets},get shells(){return shells},get flyBombs(){return flyBombs}};
requestAnimationFrame(frame);
const BUILD='1127c';
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}); if(!r.ok)return;
    const m=(await r.text()).match(/const BUILD='([^']+)'/);
    if(m&&m[1]!==BUILD&&(S.mode!=='play'||paused)){location.replace(location.pathname+'?v='+m[1]);}
  }catch(e){}
}
checkUpdate(); document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
setInterval(()=>{if(S.mode!=='play')checkUpdate();},60000);
})();
</script>
